<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Chill Player</title>
<style>
  :root { --text: #1d1d1f; --muted: #5f5f66; --bg: #ffffff; --line: #e3e3e8; --accent: #0a66d6; --box: #f5f5f7; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #f2f2f5; --muted: #a8a8b0; --bg: #111114; --line: #2c2c32; --accent: #5aa9ff; --box: #1c1c21; }
  }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 1.9em; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.2em; margin: 2em 0 0.5em; padding-top: 1em; border-top: 1px solid var(--line); }
  p, li { margin: 0.5em 0; }
  ul { padding-left: 1.25em; }
  .muted { color: var(--muted); }
  .summary { background: var(--box); border-radius: 12px; padding: 14px 18px; margin: 20px 0; }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 0.95em; }
  th, td { text-align: left; vertical-align: top; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; }
  @media (max-width: 560px) {
    table, thead, tbody, tr, th, td { display: block; }
    thead { display: none; }
    tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
    td { border: 0; padding: 2px 0; }
    td:first-child { font-weight: 600; padding-top: 6px; }
  }
</style>
</head>
<body>
<main>
<h1>Chill Player</h1>
<p>Your own cloud library, on iPhone, iPad, Mac and Apple TV.</p>
<ul>
  <li><a href="support/">Support</a></li>
  <li><a href="privacy/">Privacy Policy</a></li>
</ul>
</main>
</body>
</html>
